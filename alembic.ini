# Alembic CLI config. The database URL comes from RELOCATION_DATABASE_URL
# (default data/relocation.db) via src/relocation/migrations/env.py.
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe change"
#   uv run alembic current

[alembic]
script_location = %(here)s/src/relocation/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
